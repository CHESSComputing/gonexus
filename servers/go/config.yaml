#data_dir: /Users/vk/Work/CHESS/FOXDEN/s3/nexus-data
data_dir: /tmp
view_payload: foxden
foxden_url: http://localhost:8344/validate/gonexus
file_system_mode: true
s3_bucket: nexus-data
s3_prefix: chess/
s3_region: us-east-1
s3_force_path_style: true
s3_endpoint: http://127.0.0.1:7070
port: "8081"
cache_dir: /tmp/nexus
field_default_limit: 10000
field_max_limit: 1000000
aws_access_key: myaccess
aws_secret: mysecret
lazy: auto

# Lazy loading of big datasets (see LAZY.md). Default is off.
# lazy: off            # off | auto | all
# lazy_threshold: 100000   # auto: datasets with more elements stay on disk
# max_open_files: 8        # lazy trees (open HDF5 files) kept cached

# Large-file operation (see OPERATIONS.md).
# write_timeout: 600       # seconds a response (incl. first S3 download) may take; 0 = no limit
# head_ttl: 30             # seconds before a cached file is re-checked against S3; 0 = every request
# cache_max_bytes: 0       # cap on cache_dir size (LRU eviction); 0 = unlimited

# Serve NeXus files straight from a local directory instead of S3 (see LOCAL.md).
# Keys are paths relative to data_dir (so with s3_prefix: chess/ the file
# data_dir/chess/RE3/x.nxs has key chess/RE3/x.nxs); symlinked files AND
# directories are followed; nothing is copied into cache_dir.
# data_dir: /path/data/nexus-data
#
# Site-wide defaults for the web UI's look and feel (see UI.md). A JSON file
# like ui/config.json; users can still override it in the UI's settings panel.
# ui_config: /etc/gonexus/ui.json

# Serve HTTPS instead of HTTP (see TLS.md). Both files are PEM; the certificate
# file may include the intermediate chain. A renewed pair is picked up without
# a restart. (Unrelated to the S3_TLS_* settings, which concern the S3 connection.)
# tls_cert_file: /etc/gonexus/server.crt
# tls_key_file: /etc/gonexus/server.key
# tls_min_version: "1.2"      # or "1.3"

# Serve files by absolute path anywhere on this machine (see FILESYSTEM.md), e.g.
# http://host:8081/view?file=/nfs/chess/x/scan.nxs . data_dir then lists the
# directories that may be read, separated by ":" (empty = everything readable).
# file_system_mode: true
# data_dir: /nfs

# Access control of POST /view (see AUTH.md).
# view_payload: default      # default (file+token) | foxden (file+token+did) | your own registered payload
# token_secret: change-me    # HS256 shared secret; or:
# token_public_key_file: /etc/gonexus/authz.pub   # RS256 PEM. Neither set = signatures NOT verified
# foxden_url: https://foxden.example.org/authz/access   # required for view_payload: foxden
# foxden_timeout: 10         # seconds
# file_system_mode only: how long (seconds) /view's permission to read a file lasts.
# session_ttl: 3600
